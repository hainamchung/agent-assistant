# ============================================================================
# MATRIX SKILLS INDEX v2.1
# ============================================================================
# Central registry for the Hybrid Skill Orchestration Layer (HSOL).
#
# v2.1 ENHANCEMENTS (from HSOL-V2):
#   - Context-aware scoring with multi-factor matching
#   - Execution history learning
#   - Skill graph for relationship modeling
#   - Intelligent recommendations
#
# ARCHITECTURE:
#   - Static Layer: Domain files ({category}/{domain}.yaml) with curated skills
#   - Dynamic Layer: _dynamic.yaml with community-installed skills
#   - Discovery: See `rules/SKILLS.md` for HSOL resolution algorithm
#   - Unified resolution: Matrix-first, dynamic-enhanced
#
# HSOL v2 SCORING FORMULA:
#   final_score = (
#     semantic_match × 0.35 +
#     context_fitness × 0.25 +
#     history_momentum × 0.20 +
#     team_pattern_fit × 0.10 +
#     explicit_match × 0.10
#   ) × trust_multiplier × freshness_decay
#
# SKILL DIRECTORY STRUCTURE (verified 2026-04-26):
#   matrix-skills/
#   ├── _index.yaml              ← This file (full registry)
#   ├── foundation/               ← Tier 1: 3 .md files
#   ├── professional/             ← Tier 2: 22 files (11 YAML + 11 .md)
#   ├── specialized/              ← Tier 3: 8 files (3 YAML + 5 .md)
#   └── expert/                  ← Tier 4: 6 files (2 YAML + 4 .md)
#
# SKILL COUNTS (from domain YAML files):
#   professional/: backend, frontend, quality, research, planning, devops, data, cloud,
#                 design, mobile, gaming, languages, tools, management, orchestration
#   specialized/: architecture, security, performance
#   expert/: ai-ml, mcp
#   (see individual domain YAML files for exact per-domain skill counts)
#
# ADDITIONAL SKILL SOURCES:
#   - skills/ directory: Framework skills (fresh-context, confidence-research, etc.)
#   - _dynamic.yaml: Community and custom skills
#   - Plugin ecosystem: supabase, prisma, sentry, figma, linear, visual-testing
#
# USAGE:
#   1. Agent declares profile in frontmatter (e.g., "backend:execution")
#   2. HSOL loads relevant domain files based on agent's inherit_from
#   3. Matrix skills are injected based on relevance_mapping and priority
#   4. Dynamic discovery via `_dynamic.yaml` for potential enhancements
#   5. Superior dynamic skills are surfaced as recommendations
#
# REFERENCE:
#   - rules/SKILLS.md
#   - {MATRIX_SKILLS}/_dynamic.yaml
# ============================================================================

version: "2.1"
last_updated: "2026-04-26"

# ============================================================================
# HYBRID SKILL ORCHESTRATION LAYER (HSOL) CONFIGURATION
# ============================================================================
# v2.1: Enhanced with context-aware scoring, execution history, skill graph
# ============================================================================
hsol:
  enabled: true
  version: "2.1"
  
  # v2 Context-Aware Scoring (REPLACES v1 static scoring)
  context_aware_scoring:
    enabled: true
    
    # Scoring Formula Components
    components:
      semantic_match:
        weight: 0.35
        source: "Task description via TF-IDF similarity"
      context_fitness:
        weight: 0.25
        source: "Project tech stack, patterns, conventions match"
      history_momentum:
        weight: 0.20
        source: "Recent successful usage patterns"
      team_pattern_fit:
        weight: 0.10
        source: "Domain-appropriate skill combinations"
      explicit_match:
        weight: 0.10
        source: "Directly mentioned technologies in request"
    
    # Trust Multiplier (ENFORCED in v8.1)
    trust_multiplier:
      # ENFORCEMENT: These multipliers are applied automatically based on execution history
      success_rate >= 0.9: 1.2   # Highly trusted — boost priority
      success_rate >= 0.7: 1.0   # Normal — standard priority
      success_rate >= 0.5: 0.8   # Caution — reduce priority, recommend review
      success_rate < 0.5:  0.5   # Risky — block auto-selection, require manual override
      no_history:         0.9   # Unknown — neutral with slight caution

    # Freshness Decay (ENFORCED in v8.1)
    freshness_decay:
      days <= 7:   1.0   # Current — full score
      days <= 30:  0.95  # Recent — minor decay
      days <= 90:  0.85  # Aging — moderate decay
      days > 90:   0.7   # Stale — significant decay, recommend review
      days > 180:  0.5   # Deprecated — block auto-selection

  # TRUST DECAY ENFORCEMENT (NEW v8.1)
  trust_decay_enforcement:
    enabled: true
    version: "8.1"

    # Auto-deprecation rules
    deprecation:
      auto_deprecate_after_days: 180  # Skills not used in 6 months
      warn_after_days: 90            # Skills unused for 3 months
      require_review_after_days: 365  # Yearly skill review required

    # Trust score enforcement
    enforcement_rules:
      trust_score_below_0.3:
        action: "BLOCK_AUTO_SELECTION"
        require: "Manual override from orchestrator"
        notify: "Log warning + surface to user"

      trust_score_0.3_to_0.5:
        action: "REDUCE_PRIORITY"
        display: "⚠️ Low trust — verify effectiveness"
        allow_override: true

      trust_score_0.5_to_0.7:
        action: "STANDARD_PRIORITY"
        display: "Normal trust"

      trust_score_above_0.7:
        action: "BOOST_PRIORITY"
        display: "✅ High trust"

      trust_score_above_0.9:
        action: "PROMOTE_SKILL"
        display: "🌟 Top performer"
        auto_suggest: "Use for similar tasks"

    # Trust decay schedule
    decay_schedule:
      daily_decay_rate: 0.001  # 0.1% per day
      weekly_decay_check: true
      monthly_review: true

    # Trust recovery
    trust_recovery:
      successful_execution:
        trust_boost: 0.05  # +5% per successful use
        max_trust: 1.0

      failed_execution:
        trust_penalty: 0.10  # -10% per failure
        consecutive_failures_threshold: 3  # Alert after 3 consecutive failures

      manual_override:
        orchestrator_can_reset: true
        require_documentation: true
  
  # Skill Graph for Relationship Modeling (NEW v2)
  skill_graph:
    enabled: true
    storage: "./reports/{topic}/meta/hsol-v2/skill-graph.yaml"
    
    # Edge Types
    edge_types:
      complementary:
        description: "High effectiveness when combined"
        threshold: 0.7
      sequential:
        description: "Planning enables execution"
        threshold: 0.6
      exclusive:
        description: "Prevents need for other skill"
        threshold: 0.3
  
  # Intelligent Recommendations (NEW v2)
  recommendations:
    enabled: true
    
    triggers:
      NEW_DOMAIN:
        condition: "Task involves unfamiliar domain"
        action: "Recommend top 3 skills for domain"
      HIGH_COMPLEXITY:
        condition: "Complexity score >= 4"
        action: "Recommend specialized skills (tier 3+)"
      LOW_CONFIDENCE:
        condition: "Agent confidence < 0.85"
        action: "Recommend expert skills"
    
    thresholds:
      auto_load: 0.7
      recommend: 0.5
      minimum: 0.3
  
  # Dynamic skill discovery via _dynamic.yaml registry
  # Community and custom skills registered in matrix-skills/_dynamic.yaml
  # skill to be installed from skills.sh. See https://skills.sh/
  # If the skills package is not installed, this is gracefully skipped.
  # Skills are auto-discovered from the skills/ and matrix-skills/ directories
  find_skills:
    skill_path: "{MATRIX_SKILLS}/_dynamic.yaml"
    browse_url: "https://skills.sh/"
    cli_commands:
      search: "npx skills find [query]"
      install: "npx skills add <owner/repo@skill> -g -y"
      check: "npx skills check"
      update: "npx skills update"
  
  # Dynamic skill manifest location
  dynamic_manifest: "_dynamic.yaml"
  
  # Discovery settings
  discovery:
    enabled: true
    timeout_ms: 5000
    cache_ttl_seconds: 3600
    async_threshold: 0.8  # Matrix fitness above this skips discovery
    # Only run dynamic discovery for these variants; "fast" skips discovery so fast stays fast
    apply_for_variants: ["hard", "team"]
    
  # Fitness scoring weights
  fitness_weights:
    semantic_match: 0.35
    specificity_score: 0.25
    trust_level: 0.20
    freshness_score: 0.10
    success_rate: 0.10
    
  # Decision thresholds
  thresholds:
    matrix_sufficient: 0.8     # Execute matrix, skip discovery
    matrix_adequate: 0.75     # Below this: blocking discovery (use for current task); 0.75–0.8: async only
    superiority_delta: 0.15    # Dynamic must exceed matrix by this
    
  # Trust progression (ENFORCED in v8.1)
  trust:
    # Initial trust levels based on skill tier
    new_skill: 0.3
    after_3_executions: 0.5
    after_10_executions: 0.7
    after_25_executions: 0.85
    after_50_executions: 0.95
    matrix_promoted: 1.0

    # ENFORCEMENT: Decay settings
    decay_after_days: 90      # Start decay after 90 days of inactivity
    decay_rate_per_day: 0.002 # 0.2% decay per day
    min_trust_floor: 0.3      # Never decay below 0.3

    # Trust validation before use
    validate_before_use: true
    log_trust_decisions: true
    
  # Promotion to matrix-skills — automatic when criteria met (no queue)
  promotion:
    enabled: true
    min_executions: 10
    min_success_rate: 0.85
    max_inactive_days: 30
    automatic: true   # Auto-promote when criteria met; no human review queue
  
  # Governance baseline for dynamic skill lifecycle
  governance:
    canonical_runtime_rule: "rules/SKILLS.md"
    support_states: ["supported", "experimental", "blocked"]
    promotion_states: ["new", "evaluating", "validated", "promoted", "blocked"]
    required_dynamic_fields:
      - owner
      - checksum
      - support_state
      - promotion_state
      - freshness
      - installed_at
      - last_execution
    checksum:
      algorithm: "SHA-256"
      computed_from:
        - skill_file_content
        - file_path
        - timestamp
      command: "if command -v sha256sum &>/dev/null; then sha256sum {file} | cut -d' ' -f1; elif command -v shasum &>/dev/null; then shasum -a 256 {file} | cut -d' ' -f1; elif command -v openssl &>/dev/null; then openssl dgst -sha256 {file} | awk '{print $2}'; else echo 'ERROR: no sha256 tool found'; fi"
      # Cross-platform: sha256sum (Linux), shasum -a 256 (macOS), openssl (fallback)
      purpose: "Ensure skill integrity, detect tampering, validate version"


$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "registry-entry"
title: "Community Registry Entry"
description: "Schema for validating agent/skill community registry submissions"
type: object

required:
  - name
  - version
  - type
  - author
  - description
  - category
  - license

additionalProperties: false

$defs:
  semver:
    type: string
    pattern: "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?$"
    description: "Semantic version string (semver 2.0)"
  slug:
    type: string
    pattern: "^[a-z0-9-]+$"
    minLength: 2
    maxLength: 64
    description: "URL-safe lowercase identifier"

properties:
  name:
    $ref: "#/$defs/slug"
    description: "Unique package name (lowercase, hyphens allowed)"

  version:
    $ref: "#/$defs/semver"
    description: "Package version following semver 2.0"

  type:
    type: string
    enum:
      - agent
      - skill
      - command
      - topology
    description: "Kind of registry entry"

  author:
    type: object
    required:
      - name
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 128
      email:
        type: string
        format: email
      url:
        type: string
        format: uri
    additionalProperties: false
    description: "Author information"

  description:
    type: string
    minLength: 10
    maxLength: 500
    description: "Human-readable description of the entry"

  category:
    type: string
    enum:
      - meta
      - execution
      - investigation
      - validation
      - research
      - support
    description: "Agent category classification"

  license:
    type: string
    enum:
      - MIT
      - Apache-2.0
      - GPL-3.0-only
      - ISC
      - BSD-2-Clause
      - BSD-3-Clause
      - UNLICENSED
    description: "SPDX license identifier"

  keywords:
    type: array
    items:
      type: string
      minLength: 1
      maxLength: 32
    maxItems: 10
    uniqueItems: true
    description: "Searchable keyword tags"

  repository:
    type: string
    format: uri
    description: "Source code repository URL"

  homepage:
    type: string
    format: uri
    description: "Project homepage URL"

  compatibility:
    type: object
    properties:
      minVersion:
        $ref: "#/$defs/semver"
      maxVersion:
        $ref: "#/$defs/semver"
    additionalProperties: false
    description: "Compatible agent-assistant version range"

  dependencies:
    type: array
    items:
      type: object
      required:
        - name
        - version
      properties:
        name:
          $ref: "#/$defs/slug"
        version:
          $ref: "#/$defs/semver"
      additionalProperties: false
    description: "Required registry dependencies"

  tier:
    type: string
    enum:
      - community
      - verified
      - official
    description: "Trust tier per ADR-10 registry tiers"

  trust_score:
    type: integer
    minimum: 0
    maximum: 100
    description: "Computed trust metric (0-100)"

  checksum:
    type: string
    pattern: "^[a-f0-9]{64}$"
    description: "SHA-256 hex digest of the package contents"

  published_at:
    type: string
    format: date-time
    description: "ISO 8601 publication timestamp"
